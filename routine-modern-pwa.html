  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
    @supports (padding: max(0px)) {
      body { padding-left: max(0px, env(safe-area-inset-left)); padding-right: max(0px, env(safe-area-inset-right)); padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(80px, env(safe-area-inset-bottom)); }

    .content-area::-webkit-scrollbar-track { background: transparent; }
    .content-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    
    /* Header */
    .header {
      padding: 24px 20px 16px;
      background: linear-gradient(180deg, rgba(10,14,39,0.8) 0%, rgba(26,31,58,0.4) 100%);

    /* Empty State */
    .empty-state {

    /* Bottom Navigation */

    /* Stats Tab */
    .stat-grid {

    /* Finance */
    .finance-balance {
      background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(255,0,110,0.1));

</head>
<body>
  <div id="root"></div>

  <script type="module">
    // App State Management
    const STORAGE_KEY = 'routine-app-v2';
    const PERSIAN_DAYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
    const PERSIAN_MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];

    function toPersianDigits(n) {
      const m = { '0': '۰', '1': '۱', '2': '۲', '3': '۳', '4': '۴', '5': '۵', '6': '۶', '7': '۷', '8': '۸', '9': '۹' };
      return String(n).replace(/[0-9]/g, d => m[d]);
    }

    function divInt(a, b) { return Math.floor(a / b); }

    function gregorianToJalali(gy, gm, gd) {
      const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
      const gy2 = (gm > 2) ? (gy + 1) : gy;
      let days = 355666 + (365 * gy) + divInt(gy2 + 3, 4) - divInt(gy2 + 99, 100) + divInt(gy2 + 399, 400) + gd + g_d_m[gm - 1];
      let jy = -1595 + (33 * divInt(days, 12053));
      days %= 12053;
      jy += 4 * divInt(days, 1461);
      days %= 1461;
      if (days > 365) {
        jy += divInt(days - 1, 365);
        days = (days - 1) % 365;
      }
      let jm, jd;
      if (days < 186) {
        jm = 1 + divInt(days, 31);
        jd = 1 + (days % 31);
      } else {
        jm = 7 + divInt(days - 186, 30);
        jd = 1 + ((days - 186) % 30);
      }
      return [jy, jm, jd];
    }

    function formatJalali(date) {
      const [jy, jm, jd] = gregorianToJalali(date.getFullYear(), date.getMonth() + 1, date.getDate());
      return `${toPersianDigits(jd)} ${PERSIAN_MONTHS[jm - 1]}`;
    }

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diff = (day - 6 + 7) % 7;
      d.setDate(d.getDate() - diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }

    function getWeekDates(weekStart) {
      return Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
    }

    function uid() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
    }

    function ensureWeek(weeksObj, key) {
      if (weeksObj[key]) return weeksObj[key];
      const w = {};
      PERSIAN_DAYS.forEach(d => { w[d] = []; });
      return w;
    }

    function computeStats(weekObj) {
      if (!weekObj) return { total: 0, done: 0, percent: 0 };
      let total = 0, done = 0;
      PERSIAN_DAYS.forEach(d => {
        const arr = weekObj[d] || [];
        total += arr.length;
        done += arr.filter(t => t.done).length;
      });
      const percent = total ? Math.round((done / total) * 100) : 0;
      return { total, done, percent };
    }

    function getGreeting() {
      const h = new Date().getHours();
      if (h < 5) return '🌙 شب بخیر';
      if (h < 12) return '🌅 صبح بخیر';
      if (h < 17) return '☀️ ظهر بخیر';
      if (h < 20) return '🌆 عصر بخیر';
      return '🌙 شب بخیر';
    }

    // App Component
    function App() {
      const [data, setData] = React.useState({ weeks: {}, finance: [] });
      const [loaded, setLoaded] = React.useState(false);
      const [weekStart, setWeekStart] = React.useState(() => getWeekStart(new Date()));
      const [selectedDay, setSelectedDay] = React.useState(() => PERSIAN_DAYS[(new Date().getDay() + 1) % 7]);
      const [tab, setTab] = React.useState('routine');
      const [taskInput, setTaskInput] = React.useState('');
      const [financeType, setFinanceType] = React.useState('expense');
      const [financeAmount, setFinanceAmount] = React.useState('');
      const [financeDesc, setFinanceDesc] = React.useState('');

      React.useEffect(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            setData({ weeks: parsed.weeks || {}, finance: parsed.finance || [] });
          }
        } catch (e) {}
        setLoaded(true);
      }, []);

      React.useEffect(() => {
        if (!loaded) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {}
      }, [data, loaded]);

      if (!loaded) return null;

      const weekKey = dateKey(weekStart);
      const weekObj = data.weeks[weekKey] || {};
      const weekDates = getWeekDates(weekStart);
      const tasksForDay = weekObj[selectedDay] || [];
      const stats = computeStats(weekObj);
      const balance = data.finance.reduce((s, f) => s + (f.type === 'income' ? f.amount : -f.amount), 0);

      const handleAddTask = () => {
        if (!taskInput.trim()) return;
        setData(prev => {
          const wk = ensureWeek(prev.weeks, weekKey);
          const newDay = [...(wk[selectedDay] || []), { id: uid(), text: taskInput.trim(), done: false }];
          return { ...prev, weeks: { ...prev.weeks, [weekKey]: { ...wk, [selectedDay]: newDay } } };
        });
        setTaskInput('');
      };

      const handleToggleTask = (id) => {
        setData(prev => {
          const wk = ensureWeek(prev.weeks, weekKey);
          const updated = (wk[selectedDay] || []).map(t => t.id === id ? { ...t, done: !t.done } : t);
          return { ...prev, weeks: { ...prev.weeks, [weekKey]: { ...wk, [selectedDay]: updated } } };
        });
      };

      const handleDeleteTask = (id) => {
        setData(prev => {
          const wk = ensureWeek(prev.weeks, weekKey);
          const updated = (wk[selectedDay] || []).filter(t => t.id !== id);
          return { ...prev, weeks: { ...prev.weeks, [weekKey]: { ...wk, [selectedDay]: updated } } };
        });
      };

      const handleAddFinance = () => {
        const amt = parseFloat(financeAmount);
        if (!amt || amt <= 0) return;
        setData(prev => ({
          ...prev,
          finance: [{ id: uid(), type: financeType, amount: amt, desc: financeDesc || (financeType === 'income' ? 'درآمد' : 'هزینه'), date: dateKey(new Date()) }, ...prev.finance]
        }));
        setFinanceAmount('');
        setFinanceDesc('');
      };

      return (
        <div className="app-container">
          <div className="header">
            <div className="header-greeting">{getGreeting()}</div>
            <div className="header-subtitle">یک روز خوب و پرمحتوا برای تو</div>
            <div className="progress-ring">
              <div className="progress-circle" style={{ '--percent': `${stats.percent * 3.6}deg` }}>
                {stats.total > 0 ? toPersianDigits(stats.done) : '—'}
              </div>
              <div className="progress-info">
                <div className="progress-percent">{toPersianDigits(stats.percent)}%</div>
                <div className="progress-label">{stats.total} کار این هفته</div>
              </div>
            </div>
          </div>

          <div className="content-area">
            <div className="main-content">
              <div className="week-nav">
                <button onClick={() => setWeekStart(addDays(weekStart, -7))}>←</button>
                <span className="week-label">{formatJalali(weekStart)}</span>
                <button onClick={() => setWeekStart(addDays(weekStart, 7))}>→</button>
              </div>

              <div className="days-container">
                {weekDates.map((date, i) => {
                  const day = PERSIAN_DAYS[i];
                  const dayTasks = weekObj[day] || [];
                  const dayDone = dayTasks.filter(t => t.done).length;
                  const dayPercent = dayTasks.length ? (dayDone / dayTasks.length) * 360 : 0;
                  const isToday = dateKey(date) === dateKey(new Date());
                  const isActive = day === selectedDay;
                  return (
                    <button
                      key={day}
                      className={`day-pill ${dayTasks.length > 0 ? 'has-tasks' : ''} ${isActive ? 'active' : ''}`}
                      onClick={() => setSelectedDay(day)}
                      style={{ '--percent': `${dayPercent}deg` }}
                    >
                      <div className="day-count">{dayTasks.length > 0 ? toPersianDigits(dayDone) : '—'}</div>
                      <div className="day-label">{day[0]}</div>
                    </button>
                  );
                })}
              </div>

              {tab === 'routine' && (
                <>
                  <div className="card">
                    <div className="card-title"><span className="card-title-emoji">📋</span> {selectedDay}</div>
                    <div className="input-group">
                      <input value={taskInput} onChange={e => setTaskInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && handleAddTask()} placeholder="کاری جدید بنویس..." />
                      <button className="btn" onClick={handleAddTask}>➕</button>
                    </div>
                    {tasksForDay.length === 0 ? (
                      <div className="empty-state"><div className="empty-emoji">✨</div><div className="empty-text">هنوز کاری اضافه نکردی</div></div>
                    ) : (
                      <div className="task-list">
                        {tasksForDay.map(t => (
                          <div key={t.id} className={`task-item ${t.done ? 'done' : ''}`}>
                            <button className={`task-checkbox ${t.done ? 'checked' : ''}`} onClick={() => handleToggleTask(t.id)} />
                            <span className="task-text">{t.text}</span>
                            <button className="task-delete" onClick={() => handleDeleteTask(t.id)}>✕</button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </>
              )}

              {tab === 'stats' && (
                <div className="card">
                  <div className="card-title"><span className="card-title-emoji">📊</span> آمار هفتگی</div>
                  <div className="stat-grid">
                    <div className="stat-box">
                      <div className="stat-number">{toPersianDigits(stats.done)}</div>
                      <div className="stat-label">انجام شده</div>
                    </div>
                    <div className="stat-box">
                      <div className="stat-number">{toPersianDigits(stats.total - stats.done)}</div>
                      <div className="stat-label">باقی مانده</div>
                    </div>
                    <div className="stat-box">
                      <div className="stat-number">{toPersianDigits(stats.percent)}%</div>
                      <div className="stat-label">پیشرفت</div>
                    </div>
                    <div className="stat-box">
                      <div className="stat-number">🔥</div>
                      <div className="stat-label">بمب!</div>
                    </div>
                  </div>
                </div>
              )}

              {tab === 'finance' && (
                <div className="card">
                  <div className="card-title"><span className="card-title-emoji">💰</span> مالی</div>
                  <div className="finance-balance">
                    <div className="finance-label">مانده</div>
                    <div className="finance-amount">{toPersianDigits(Math.round(balance).toLocaleString())} تومان</div>
                    <div className="finance-detail">
                      <div className="finance-item">📈 {toPersianDigits(data.finance.filter(f => f.type === 'income').reduce((s, f) => s + f.amount, 0).toLocaleString())}</div>
                      <div className="finance-item">📉 {toPersianDigits(data.finance.filter(f => f.type === 'expense').reduce((s, f) => s + f.amount, 0).toLocaleString())}</div>
                    </div>
                  </div>
                  <div className="input-group" style={{ marginBottom: '12px' }}>
                    <select value={financeType} onChange={e => setFinanceType(e.target.value)} style={{ ...document.querySelector('input')?.style, flex: 0.3 }}>
                      <option value="expense">🔴 هزینه</option>
                      <option value="income">🟢 درآمد</option>
                    </select>
                    <input value={financeAmount} onChange={e => setFinanceAmount(e.target.value)} type="number" inputMode="numeric" placeholder="مبلغ" />
                    <button className="btn" onClick={handleAddFinance} style={{ padding: '12px 12px' }}>➕</button>
                  </div>
                  <input value={financeDesc} onChange={e => setFinanceDesc(e.target.value)} placeholder="توضیح (اختیاری)" className="input-group" style={{ width: '100%' }} />
                  {data.finance.length === 0 ? (
                    <div className="empty-state" style={{ marginTop: '20px' }}><div className="empty-emoji">💳</div><div className="empty-text">تراکنشی ثبت نشده</div></div>
                  ) : (
                    <div className="task-list" style={{ marginTop: '12px' }}>
                      {data.finance.slice(0, 10).map(f => (
                        <div key={f.id} className="task-item">
                          <span style={{ fontSize: '16px' }}>{f.type === 'income' ? '📈' : '📉'}</span>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div className="task-text">{f.desc}</div>
                            <div style={{ fontSize: '11px', color: 'rgba(255,255,255,0.4)' }}>{toPersianDigits(f.amount.toLocaleString())} تومان</div>
                          </div>
                          <button className="task-delete" onClick={() => setData(prev => ({ ...prev, finance: prev.finance.filter(x => x.id !== f.id) }))}>✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>

          <div className="bottom-nav">
            <button className={`nav-item ${tab === 'routine' ? 'active' : ''}`} onClick={() => setTab('routine')}>
              <span className="nav-icon">📋</span>
              <span className="nav-label">روتین</span>
            </button>
            <button className={`nav-item ${tab === 'stats' ? 'active' : ''}`} onClick={() => setTab('stats')}>
              <span className="nav-icon">📊</span>
              <span className="nav-label">آمار</span>
            </button>
            <button className={`nav-item ${tab === 'finance' ? 'active' : ''}`} onClick={() => setTab('finance')}>
              <span className="nav-icon">💰</span>
              <span className="nav-label">مالی</span>
            </button>
          </div>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      const sw = `
        self.addEventListener('install', (e) => e.waitUntil(self.skipWaiting()));
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claimClients()));
        self.addEventListener('fetch', (e) => {
          if (e.request.method === 'GET') {
            e.respondWith(
              fetch(e.request).catch(() => {
                return new Response('Offline', { status: 503 });
              })
            );
          }
        });
      `;
      const blob = new Blob([sw], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      navigator.serviceWorker.register(url).catch(() => {});
    }
  </script>
</body>
</html>
